name: Build Android Remote APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-remote/**'
      - '.github/workflows/android-remote.yml'
      - 'settings.gradle'
jobs:
  remote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - run: gradle :android-remote:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: HAIDER-Remote-Android-APK
          path: android-remote/build/outputs/apk/debug/android-remote-debug.apk
          if-no-files-found: error
