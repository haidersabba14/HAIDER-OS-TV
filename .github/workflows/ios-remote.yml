name: Build HAIDER Remote IPA
on:
  workflow_dispatch:
  push:
    paths:
      - 'ios-remote/**'
      - '.github/workflows/ios-remote.yml'
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: cd ios-remote && xcodegen generate
      - name: Build unsigned iOS device app
        run: |
          xcodebuild -project ios-remote/HAIDERRemote.xcodeproj -scheme HAIDERRemote -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        run: |
          mkdir -p dist/Payload
          cp -R build/Build/Products/Release-iphoneos/HAIDERRemote.app dist/Payload/
          cd dist && zip -qr HAIDER-Remote-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: HAIDER-Remote-unsigned-IPA
          path: dist/HAIDER-Remote-unsigned.ipa
          if-no-files-found: error
